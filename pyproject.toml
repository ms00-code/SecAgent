[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secagent"
version = "0.1.0"
description = "AI-assisted web security reconnaissance CLI for authorized testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["security", "reconnaissance", "pentesting", "web-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ms00-code/secagent"
Repository = "https://github.com/ms00-code/secagent"
Issues = "https://github.com/ms00-code/secagent/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
secagent = "secagent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["secagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
